settings.fieldDescriptions.approvals.timeout: Onay istemlerinin zaman aşımına uğramadan önce bekleme süresi.
settings.fieldDescriptions.auxiliary.compression.timeout: Yardımcı sıkıştırma modelini çağrı başına beklenecek saniye (varsayılan 120). Yavaş yerel modeller için artırın.
settings.fieldDescriptions.browser.useRealProfile: Yerel gezinme gerçek girişlerinizi kullanır. Hermes varsayılan tarayıcınızın profilini (çerezler, girişler, tercihler) yönetilen bir anlık görüntüye kopyalar ve paketlenmiş Chromium'uyla sürer — canlı profiliniz asla doğrudan açılmaz ve kopya her çalıştırmada ondan yenilenir. Ayrıca bulut tarayıcı arka ucu yapılandırılmış olsa bile ajanın istek üzerine yerel gerçel-profil oturumu açmasına izin verir. Yalnızca Chromium tarayıcıları (Chrome, Edge, Brave, Brave Origin, Chromium) desteklenir; Chromium olmayan bir varsayılan net bir mesajla başarısız olur. Varsayılan olarak kapalıdır.
settings.fieldDescriptions.checkpoints.enabled: Dosya düzenlemelerinden önce geri alma anlık görüntüleri oluştur.
settings.fieldDescriptions.codeExecution.mode: Kod yürütmesinin mevcut projeye ne kadar sıkı şekilde kapsandırıldığı.
settings.fieldDescriptions.compression.codexGpt55Autoraise: Desteklenen ChatGPT Codex OAuth modelleri için sıkıştırmayı %85'e yükselt.
settings.fieldDescriptions.compression.enabled: Konuşmalar büyüdüğünde eski bağlamı özetle.
settings.fieldDescriptions.context.engine: Bağlam sınırına yakın uzun konuşmaları yönetme stratejisi.
settings.fieldDescriptions.desktop.repoScanEnabled: Projeler'de gösterilmek için yerel klasörlerde Git depolarını tara.
settings.fieldDescriptions.desktop.repoScanExcludePaths: Dep keşfi sırasında atlanacak klasörler ve onların altındakiler.
settings.fieldDescriptions.desktop.repoScanRoots: Taranacak klasörler. Ana dizininizi taramak için boş bırakın.
settings.fieldDescriptions.display.personality: Yeni oturumlar için varsayılan asistan stili.
settings.fieldDescriptions.display.showReasoning: Arka uç düşünme bölümleri sağladığında göster.
settings.fieldDescriptions.fallbackProviders: Varsayılan model başarısız olursa denenecek yedek sağlayıcı:model girdileri.
settings.fieldDescriptions.fileReadMaxChars: Hermes'in tek bir dosya isteğinden okuyabileceği en fazla karakter.
settings.fieldDescriptions.memory.memoryEnabled: Gelecek oturumalara yardımcı olabilecek kalıcı anılar kaydet.
settings.fieldDescriptions.memory.userProfileEnabled: Kullanıcı tercihlerinin küçük bir profilini koru.
settings.fieldDescriptions.model: Oluşturucuda farklı bir model seçmediğiniz sürece yeni sohbetler için kullanılır.
settings.fieldDescriptions.modelContextLength: Yalnızca ANA sohbet modelinin algılanan bağlam penceresini geçersiz kılar (token). Seçili modelin algılanan değerini kullanmak için 0'da bırakın. Yardımcı/MoA modellerini etkilemez.
settings.fieldDescriptions.security.redactSecrets: Mümkün olduğunda algılanan gizli bilgileri model tarafından görülebilir içerikten gizle.
settings.fieldDescriptions.stt.echoTranscripts: Ses mesajlarının ham 🎙️ transkriptini sohbete geri gönder.
settings.fieldDescriptions.stt.elevenlabs.languageCode: İsteğe bağlı ISO-639-3 dil kodu. Boş, ElevenLabs'in otomatik algılamasına izin verir.
settings.fieldDescriptions.stt.enabled: Yerel veya sağlayıcı destekli konuşma transkripsiyonunu etkinleştir.
settings.fieldDescriptions.stt.streaming: Konuşurken metni göster (OpenAI, xAI, ElevenLabs). Herhangi bir hatada kayda geri döner.
settings.fieldDescriptions.terminal.cwd: Araç ve terminal çalışması için varsayılan proje klasörü.
settings.fieldDescriptions.terminal.daytonaImage: Yürütme arka ucu Daytona olduğunda kullanılan görüntü.
settings.fieldDescriptions.terminal.dockerImage: Yürütme arka ucu Docker olduğunda kullanılan konteyner görüntüsü.
settings.fieldDescriptions.terminal.envPassthrough: Araç yürütmesine aktarılacak ortam değişkenleri.
settings.fieldDescriptions.terminal.modalImage: Yürütme arka ucu Modal olduğunda kullanılan görüntü.
settings.fieldDescriptions.terminal.persistentShell: 'SSH arka ucu: komutlar arasında aktarılan değişkenleri koru. Kapalı, her komutu giriş ortamından başlatır; çalışma dizini her zaman taşınır.'
settings.fieldDescriptions.terminal.singularityImage: Yürütme arka ucu Singularity olduğunda kullanılan görüntü.
settings.fieldDescriptions.timezone: IANA saat dilimi tanımlayıcısı. Boş, sistem saat dilimini kullanır.
settings.fieldDescriptions.tts.neutts.device: NeuTTS için yerel çıkarım cihazı.
settings.fieldDescriptions.tts.xai.autoSpeechTags: Bir LLM'in sentezden önce metne ifadelendirici ses etiketleri ([laughing], [sighs]) eklemesine izin verin.
settings.fieldDescriptions.tts.xai.bitRate: bps cinsinden MP3 bit hızı. Yalnızca codec mp3 olduğunda geçerlidir.
settings.fieldDescriptions.tts.xai.language: Konuşulan dil kodu (örn. en, pt-BR) veya otomatik algılama için "auto".
settings.fieldDescriptions.tts.xai.optimizeStreamingLatency: Gecikme ile kalite arasındaki ödün. 0 = en iyi kalite, 2 = en düşük gecikme.
settings.fieldDescriptions.tts.xai.sampleRate: Hz cinsinden ses örnekleme hızı. Daha yüksek = daha iyi kalite, daha büyük dosyalar.
settings.fieldDescriptions.tts.xai.speed: Oynatma hızı. 0.7 = daha yavaş, 1.0 = normal, 1.5 = daha hızlı.
settings.fieldDescriptions.tts.xai.voiceId: xAI ses kimliği (örn. eve) veya özel bir ses kimliği.
settings.fieldDescriptions.updates.nonInteractiveLocalChanges: Hermes uygulama içinden kendini güncellediğinde (terminal istemi olmadan) yerel kaynak düzenlemelerini sakla (stash) veya at (discard). Terminal güncellemeleri her zaman sorar.
settings.fieldDescriptions.voice.autoTts: Asistan yanıtlarını otomatik olarak sesli oku.
settings.fieldDescriptions.voice.gptLive.instructions: Canlı ses kişiliği için ek cümleler (ton, tempo, dil). Hermes kendi sistem istemini korur.
settings.fieldDescriptions.voice.gptLive.voice: GPT-Live modu için ses. Özel ses kimlikleri kabul edilir.
settings.fieldDescriptions.voice.voiceChatMode: 'zincirli: konuşmadan metne → Hermes → metinden konuşmaya, aşağıdaki sağlayıcılarla. gpt-live: tam çift yönlü bir OpenAI ses modeli (gpt-live-1) dinler ve konuşur, her gerçek isteği Hermes''e devreder — seçtiğiniz her model tüm araç setiyle yanıtlar. Bir OpenAI API anahtarı gerekir; ses katmanı dakikada $0.05 faturalandırır.'
