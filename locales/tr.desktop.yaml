settings.fieldDescriptions.agent.imageInputMode: Görüntü eklerinin modele nasıl gönderildiğini denetler.
settings.fieldDescriptions.agent.maxTurns: Hermes'in bir çalıştırmayı durdurmadan önceki araç çağrısı turlarının üst sınırı.
